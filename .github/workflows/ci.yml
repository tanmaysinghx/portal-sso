name: CI

# Pipeline (jobs within a stage run in parallel):
#
#   1 · Build & test       backend tests · console build + unit tests · SDK build
#   2 · Static analysis    CodeQL (Java, TypeScript)
#   3 · Package            Docker image build + smoke test against PostgreSQL
#   4 · Gate               single required status check for branch protection
#   5 · Release            tagged GitHub release (main pushes only)
#
# Every job has to prove something: a stage that cannot fail is decoration, not a gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the run still in flight — no value in finishing a build for
# a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  # Node 24 to match the npm that wrote package-lock.json; on Node 22 (npm 10) `npm ci` fails on
  # the platform-specific optional dependency tree.
  NODE_VERSION: '24'

jobs:
  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # Stage 1 · Build & test
  # ───────────────────────────────────────────────────────────────────────────────────────────────

  backend:
    name: "Stage 1 · Backend tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # The Maven build shells out to `npm run build` at generate-resources, so the frontend
      # toolchain has to be present even for a backend-only run.
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal-client/package-lock.json

      - name: Install console dependencies
        working-directory: portal-client
        run: npm ci

      # Docker is present on ubuntu-latest at the standard socket, so the Testcontainers MySQL
      # test runs here rather than being skipped — which is the point of it. It exercises the
      # branch of migration 007 that only ever executes on MySQL, and which the H2 suite cannot
      # reach.
      - name: Build and test
        working-directory: portal-server
        run: ./mvnw -B verify

      - name: Confirm the MySQL migration test was not skipped
        working-directory: portal-server
        run: |
          report=target/surefire-reports/TEST-com.tanmaysinghx.portalsso.schema.MySqlMigrationIntegrationTest.xml
          if [ ! -f "$report" ]; then
            echo "::error::The MySQL migration test produced no report."
            exit 1
          fi
          skipped=$(grep -o 'skipped="[0-9]*"' "$report" | head -1 | grep -o '[0-9]*')
          tests=$(grep -o 'tests="[0-9]*"' "$report" | head -1 | grep -o '[0-9]*')
          echo "MySQL migration test: $tests run, $skipped skipped."
          if [ "${skipped:-0}" != "0" ]; then
            echo "::error::The MySQL migration test was skipped — Docker was not detected, so the MySQL-only branch went untested."
            exit 1
          fi

      # This project has been bitten by a test class that silently ran zero tests: @Nested with
      # @SpringBootTest reports success while executing nothing. A green build that ran no tests is
      # worse than a red one, so the count is asserted rather than assumed.
      - name: Assert tests actually ran
        working-directory: portal-server
        run: |
          if [ ! -d target/surefire-reports ]; then
            echo "::error::No surefire reports — the test phase did not run."
            exit 1
          fi
          total=$(grep -ho 'tests="[0-9]*"' target/surefire-reports/TEST-*.xml \
                  | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "Executed $total tests."
          if [ "${total:-0}" -lt 150 ]; then
            echo "::error::Only $total tests ran; expected at least 150. A suite that shrank silently is a defect."
            exit 1
          fi
          for f in target/surefire-reports/TEST-*.xml; do
            if grep -q '<testsuite[^>]* tests="0"' "$f"; then
              echo "::error::$(basename "$f") ran zero tests."
              exit 1
            fi
          done

      - name: Test summary
        if: always()
        working-directory: portal-server
        run: |
          [ -d target/surefire-reports ] || exit 0
          sum() { grep -ho "<testsuite[^>]* $1=\"[0-9]*\"" target/surefire-reports/TEST-*.xml \
                  | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}'; }
          tests=$(sum tests); failures=$(sum failures); errors=$(sum errors); skipped=$(sum skipped)
          classes=$(ls target/surefire-reports/TEST-*.xml | wc -l)
          status="Passed"; [ $((failures + errors)) -gt 0 ] && status="Failed"
          {
            echo "### Backend tests — $status"
            echo ""
            echo "| Classes | Tests | Failures | Errors | Skipped |"
            echo "|---:|---:|---:|---:|---:|"
            echo "| $classes | $tests | $failures | $errors | $skipped |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: portal-server/target/surefire-reports/
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: portal-server-jar
          path: portal-server/target/portal-sso.jar
          retention-days: 7

  frontend:
    name: "Stage 1 · Console build & unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal-client/package-lock.json

      # `npm ci` fails outright if package.json and package-lock.json disagree, so this doubles as
      # the check that the lock file is complete for Linux. It was not, until it was regenerated
      # there: the macOS-generated lock omitted Tailwind's wasm32 fallback dependencies.
      - name: Install
        working-directory: portal-client
        run: npm ci

      - name: Unit tests
        working-directory: portal-client
        run: npx ng test --watch=false

      # Production configuration: AOT, hashed output, and the bundle budgets in angular.json.
      - name: Production build
        working-directory: portal-client
        run: npx ng build

      - name: Bundle summary
        working-directory: portal-client
        run: |
          {
            echo "### Console bundle"
            echo ""
            echo "| Output | Size |"
            echo "|---|---:|"
            echo "| Total | $(du -sh dist/portal-client | cut -f1) |"
            echo "| JavaScript | $(find dist/portal-client -name '*.js' -print0 | du -ch --files0-from=- | tail -1 | cut -f1) |"
            echo "| CSS | $(find dist/portal-client -name '*.css' -print0 | du -ch --files0-from=- | tail -1 | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

  sdk:
    name: "Stage 1 · SDK build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal-client/package-lock.json

      # The SDK compiles with the console's TypeScript, so the versions can never drift apart.
      - name: Install toolchain
        working-directory: portal-client
        run: npm ci

      - name: Build @tanmaysinghx/portal-sso
        working-directory: packages/portal-sso
        run: npm run build

      # dist/ is committed so `npm install github:tanmaysinghx/portal-sso#path:packages/portal-sso`
      # works without a build step. A source change without a rebuild would ship stale code.
      - name: Verify committed dist/ matches source
        run: |
          if ! git diff --exit-code --stat -- packages/portal-sso/dist; then
            echo "::error::packages/portal-sso/dist is out of date. Run 'npm run build' in packages/portal-sso and commit the result."
            exit 1
          fi
          echo "dist/ is up to date."

      - name: Verify package contents
        working-directory: packages/portal-sso
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          {
            echo "### SDK package"
            echo '```'
            grep -E "name:|version:|package size|unpacked size|total files" pack.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # Stage 2 · Static analysis
  # ───────────────────────────────────────────────────────────────────────────────────────────────

  codeql:
    name: "Stage 2 · CodeQL (${{ matrix.language }})"
    runs-on: ubuntu-latest
    # Code scanning on private repositories requires GitHub Advanced Security.
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      # build-mode none: analyses source directly, so this does not repeat the full Maven + Angular
      # build already proven in Stage 1.
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # Stage 3 · Package
  # ───────────────────────────────────────────────────────────────────────────────────────────────

  image:
    name: "Stage 3 · Docker image & smoke test"
    runs-on: ubuntu-latest
    # No point proving the image builds if the code is broken or a gate failed.
    needs: [backend, frontend, sdk]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: there is no registry configured yet. The value here is catching a
      # Dockerfile that stopped building, which is otherwise only discovered at deploy time.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: portal-sso:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles; this proves it runs. A container that starts and then dies on
      # a missing migration or a bad entrypoint would otherwise pass.
      - name: Smoke test the image
        run: |
          docker network create ci-net
          docker run -d --name ci-db --network ci-net \
            -e POSTGRES_DB=portalsso -e POSTGRES_USER=portal -e POSTGRES_PASSWORD=ci-password \
            postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec ci-db pg_isready -U portal -d portalsso && break
            sleep 2
          done

          docker run -d --name ci-app --network ci-net -p 8080:8080 \
            -e DB_URL=jdbc:postgresql://ci-db:5432/portalsso \
            -e DB_USERNAME=portal -e DB_PASSWORD=ci-password \
            -e ISSUER_URL=http://localhost:8080 \
            -e APP_SECURITY_MFA_ENCRYPTION_KEY=ci-only-not-a-real-key \
            -e APP_BOOTSTRAP_ADMIN_EMAIL=ci@example.com \
            -e APP_BOOTSTRAP_ADMIN_PASSWORD=CiAdminPassword1 \
            -e SERVER_SERVLET_SESSION_COOKIE_SECURE=false \
            portal-sso:ci

          started=$(date +%s)
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' ci-app 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            if [ "$(docker inspect -f '{{.State.Status}}' ci-app)" = "exited" ]; then
              echo "::error::Container exited during startup."
              docker logs ci-app
              exit 1
            fi
            sleep 5
          done
          boot_seconds=$(( $(date +%s) - started ))

          if [ "$(docker inspect -f '{{.State.Health.Status}}' ci-app)" != "healthy" ]; then
            echo "::error::Container never became healthy."
            docker logs ci-app
            exit 1
          fi

          # Liquibase migrated an empty database and the bootstrap administrator exists — the two
          # things a self-hoster does first.
          issuer=$(curl -fsS http://localhost:8080/.well-known/openid-configuration | grep -o '"issuer":"[^"]*"')
          echo "Discovery document served: $issuer"

          docker logs ci-app 2>&1 | grep -q "Bootstrapped administrator" \
            || { echo "::error::Bootstrap administrator was not created."; docker logs ci-app; exit 1; }
          echo "Bootstrap administrator created."

          size=$(docker image inspect portal-sso:ci --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1024/1024}')
          {
            echo "### Docker image"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Image size | $size |"
            echo "| Healthy after | ${boot_seconds}s |"
            echo "| OIDC discovery | \`$issuer\` |"
            echo "| Bootstrap admin | created |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs on failure
        if: failure()
        run: docker logs ci-app || true

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # Stage 4 · Gate
  # ───────────────────────────────────────────────────────────────────────────────────────────────

  # The one status check to mark as required in branch protection. It passes only if every job
  # above succeeded or was legitimately skipped (CodeQL on a private repo), so adding a job never
  # means editing protection rules.
  ci-status:
    name: "Stage 4 · All checks passed"
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, frontend, sdk, codeql, image]
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "### Pipeline result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for job in $(echo "$RESULTS" | jq -r 'keys[]'); do
            result=$(echo "$RESULTS" | jq -r --arg j "$job" '.[$j].result')
            case "$result" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
            echo "| $job | $result |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$failed" = "1" ]; then
            echo "::error::One or more pipeline jobs failed or were cancelled."
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # Stage 5 · Release
  # ───────────────────────────────────────────────────────────────────────────────────────────────

  release:
    name: "Stage 5 · Release"
    runs-on: ubuntu-latest
    needs: [ci-status]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.ci-status.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled JAR
        uses: actions/download-artifact@v4
        with:
          name: portal-server-jar
          path: dist/

      - name: Prepare release artifacts
        id: prep
        run: |
          JAR_FILE=$(find dist -name "*.jar" ! -name "*.original" | head -n 1)
          cp "$JAR_FILE" ./portal-sso.jar
          sha256sum portal-sso.jar > portal-sso.jar.sha256
          TAG="v25.0.${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "### Release $TAG"
            echo '```'
            cat portal-sso.jar.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Portal SSO ${{ steps.prep.outputs.tag }} (LTS 25)
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            portal-sso.jar
            portal-sso.jar.sha256
          body: |
            ## Portal SSO — standalone executable

            ### Download
            - **[portal-sso.jar](https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/portal-sso.jar)** — single jar with the embedded admin console
            - **[portal-sso.jar.sha256](https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/portal-sso.jar.sha256)**

            ### Quick start (Java 25+)
            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/portal-sso.jar
            sha256sum -c <(curl -sL https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/portal-sso.jar.sha256)
            java -jar portal-sso.jar --httpPort=8080
            ```

            On first boot the server creates an embedded database in `~/.portal-sso` and prints the
            initial administrator password to the terminal. Production setup: see the README.
