spring:
  datasource:
    url: jdbc:h2:mem:portalsso;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

app:
  security:
    mfa:
      # The suite enrols users in MFA, and enrolment now requires a key — as it does in any real
      # deployment. Test-only value; production supplies its own.
      encryption-key: test-only-mfa-encryption-key-not-a-secret

  seed:
    test-data: true

  rate-limit:
    # Off for the suite so shared-IP MockMvc tests stay deterministic — every request originates
    # from 127.0.0.1, so one test's sign-ins would otherwise eat another's allowance and fail it
    # for reasons unrelated to what it asserts.
    # RateLimitIntegrationTest switches it back on with tiny limits to exercise the real behaviour.
    enabled: false
