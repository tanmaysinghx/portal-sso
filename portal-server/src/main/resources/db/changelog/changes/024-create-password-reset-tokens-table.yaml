databaseChangeLog:
  - changeSet:
      id: 024-create-password-reset-tokens-table
      author: ai-agent
      changes:
        # One row per "forgot password" email. Deliberately not a purpose on magic_link_tokens:
        # issuing a reset must not cancel an outstanding sign-in link (or the reverse), the reset
        # works whether or not passwordless sign-in is switched on, and the two have separate
        # rate limits and retention.
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              # SHA-256 of the emailed token, hex. The token itself is never stored: it is a
              # credential that can set the account's password.
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_password_reset_tokens_token_hash
              - column:
                  name: user_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              # Lower-cased. Kept beside user_id for the per-address issue limit and for incident
              # review after the account itself may have been deleted.
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: TIMESTAMP
              - column:
                  name: requester_ip
                  type: VARCHAR(45)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: ix_password_reset_tokens_email_created
            tableName: password_reset_tokens
            columns:
              - column:
                  name: email
              - column:
                  name: created_at
        - createIndex:
            indexName: ix_password_reset_tokens_expires_at
            tableName: password_reset_tokens
            columns:
              - column:
                  name: expires_at
