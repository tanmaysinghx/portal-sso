databaseChangeLog:
  - changeSet:
      id: 012-create-applications-table
      author: tanmaysinghx
      changes:
        - createTable:
            tableName: applications
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: app_url
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: icon_url
                  type: VARCHAR(1000)
              - column:
                  name: category
                  type: VARCHAR(100)
                  defaultValue: General
                  constraints:
                    nullable: false
              - column:
                  name: client_id
                  type: VARCHAR(100)
              - column:
                  name: access_type
                  type: VARCHAR(50)
                  defaultValue: ALL_USERS
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: display_order
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: ix_applications_name
            tableName: applications
            columns:
              - column:
                  name: name

        - createIndex:
            indexName: ix_applications_category
            tableName: applications
            columns:
              - column:
                  name: category

        - createTable:
            tableName: application_roles
            columns:
              - column:
                  name: application_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: application_roles
            columnNames: application_id, role_id
            constraintName: pk_application_roles
        - addForeignKeyConstraint:
            baseTableName: application_roles
            baseColumnNames: application_id
            referencedTableName: applications
            referencedColumnNames: id
            constraintName: fk_app_roles_app
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: application_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_app_roles_role
            onDelete: CASCADE
