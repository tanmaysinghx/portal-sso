databaseChangeLog:
  - changeSet:
      id: 013-add-external-auth-to-applications
      author: tanmaysinghx
      changes:
        - addColumn:
            tableName: applications
            columns:
              - column:
                  name: external_auth_enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: external_auth_api_key_hash
                  type: VARCHAR(255)
              - column:
                  name: external_auth_api_key_prefix
                  type: VARCHAR(16)
