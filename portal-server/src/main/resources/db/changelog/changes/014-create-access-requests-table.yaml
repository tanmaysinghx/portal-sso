databaseChangeLog:
  - changeSet:
      id: 014-create-access-requests-table
      author: ai-agent
      changes:
        - createTable:
            tableName: access_requests
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: application_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: reviewer_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(500)
              - column:
                  name: reviewer_comment
                  type: VARCHAR(500)
              - column:
                  name: resolved_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: access_requests
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_access_req_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: access_requests
            baseColumnNames: application_id
            referencedTableName: applications
            referencedColumnNames: id
            constraintName: fk_access_req_app
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: access_requests
            baseColumnNames: reviewer_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_access_req_reviewer
            onDelete: CASCADE
        - createIndex:
            indexName: ix_access_requests_user
            tableName: access_requests
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: ix_access_requests_reviewer_status
            tableName: access_requests
            columns:
              - column:
                  name: reviewer_id
              - column:
                  name: status
        - createIndex:
            indexName: ix_access_requests_app
            tableName: access_requests
            columns:
              - column:
                  name: application_id
