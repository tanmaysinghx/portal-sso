databaseChangeLog:
  - changeSet:
      id: 004-create-oauth-clients-table
      author: tanmaysinghx
      changes:
        - createTable:
            tableName: oauth_clients
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_oauth_clients_client_id
              - column:
                  name: client_id_issued_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: client_secret
                  type: VARCHAR(200)
              - column:
                  name: client_secret_expires_at
                  type: TIMESTAMP
              - column:
                  name: client_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: client_authentication_methods
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: authorization_grant_types
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: redirect_uris
                  type: VARCHAR(1000)
              - column:
                  name: post_logout_redirect_uris
                  type: VARCHAR(1000)
              - column:
                  name: scopes
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: client_settings
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false
              - column:
                  name: token_settings
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false
              - column:
                  name: logo_url
                  type: VARCHAR(500)
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
