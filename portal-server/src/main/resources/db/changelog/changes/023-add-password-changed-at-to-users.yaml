databaseChangeLog:
  - changeSet:
      id: 023-add-password-changed-at-to-users
      author: ai-agent
      changes:
        # When the current password was set. Drives password expiry (app.security.password.max-age-days)
        # and the "expires in N days" countdown on My Account.
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: password_changed_at
                  type: TIMESTAMP
        # Backfilled to the moment of the upgrade, NOT to created_at. Backfilling from created_at
        # would expire every long-standing account the instant a server with a maximum age came up,
        # locking a whole organisation into forced changes on the same morning. Starting everyone's
        # clock now gives each account one full period, which is what turning the policy on means.
        - update:
            tableName: users
            columns:
              - column:
                  name: password_changed_at
                  valueComputed: CURRENT_TIMESTAMP
        - addNotNullConstraint:
            tableName: users
            columnName: password_changed_at
            columnDataType: TIMESTAMP
