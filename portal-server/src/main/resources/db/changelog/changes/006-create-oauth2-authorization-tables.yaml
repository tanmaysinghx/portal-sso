databaseChangeLog:
  - changeSet:
      id: 006-create-oauth2-authorization-tables
      author: tanmaysinghx
      changes:
        - createTable:
            tableName: oauth2_authorization
            columns:
              - column:
                  name: id
                  type: VARCHAR(100)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: registered_client_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: principal_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: authorization_grant_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: authorized_scopes
                  type: VARCHAR(1000)
              - column:
                  name: attributes
                  type: TEXT
              - column:
                  name: state
                  type: VARCHAR(500)
              - column:
                  name: authorization_code_value
                  type: TEXT
              - column:
                  name: authorization_code_issued_at
                  type: TIMESTAMP
              - column:
                  name: authorization_code_expires_at
                  type: TIMESTAMP
              - column:
                  name: authorization_code_metadata
                  type: TEXT
              - column:
                  name: access_token_value
                  type: TEXT
              - column:
                  name: access_token_issued_at
                  type: TIMESTAMP
              - column:
                  name: access_token_expires_at
                  type: TIMESTAMP
              - column:
                  name: access_token_metadata
                  type: TEXT
              - column:
                  name: access_token_type
                  type: VARCHAR(100)
              - column:
                  name: access_token_scopes
                  type: VARCHAR(1000)
              - column:
                  name: oidc_id_token_value
                  type: TEXT
              - column:
                  name: oidc_id_token_issued_at
                  type: TIMESTAMP
              - column:
                  name: oidc_id_token_expires_at
                  type: TIMESTAMP
              - column:
                  name: oidc_id_token_metadata
                  type: TEXT
              - column:
                  name: refresh_token_value
                  type: TEXT
              - column:
                  name: refresh_token_issued_at
                  type: TIMESTAMP
              - column:
                  name: refresh_token_expires_at
                  type: TIMESTAMP
              - column:
                  name: refresh_token_metadata
                  type: TEXT
              - column:
                  name: user_code_value
                  type: TEXT
              - column:
                  name: user_code_issued_at
                  type: TIMESTAMP
              - column:
                  name: user_code_expires_at
                  type: TIMESTAMP
              - column:
                  name: user_code_metadata
                  type: TEXT
              - column:
                  name: device_code_value
                  type: TEXT
              - column:
                  name: device_code_issued_at
                  type: TIMESTAMP
              - column:
                  name: device_code_expires_at
                  type: TIMESTAMP
              - column:
                  name: device_code_metadata
                  type: TEXT

        - createTable:
            tableName: oauth2_authorization_consent
            columns:
              - column:
                  name: registered_client_id
                  type: VARCHAR(100)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_oauth2_authorization_consent
                    nullable: false
              - column:
                  name: principal_name
                  type: VARCHAR(200)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_oauth2_authorization_consent
                    nullable: false
              - column:
                  name: authorities
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
