spring:
  application:
    name: portal-server

  security:
    oauth2:
      authorizationserver:
        issuer: ${ISSUER_URL:http://localhost:8080}

  datasource:
    url: ${DB_URL:jdbc:h2:file:${PORTAL_HOME:${user.home}/.portal-sso}/data/portalsso;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # Liquibase owns the schema across all databases (Postgres, MySQL, H2).
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

server:
  port: ${SERVER_PORT:8080}
  # Only affects Spring's fallback /error response. API errors are rendered by GlobalExceptionHandler
  # with curated PRTL-xxxx messages; raw exception text must not reach clients in production.
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}
    include-binding-errors: ${SERVER_ERROR_INCLUDE_BINDING_ERRORS:never}
    include-stacktrace: never

  # Behind a reverse proxy or load balancer (nginx, AWS ALB, Traefik, Cloudflare), set this to
  # FRAMEWORK. Spring then resolves the real client IP and scheme from the X-Forwarded-* headers
  # once, centrally, and getRemoteAddr() returns the caller rather than the proxy.
  #
  # It matters more than it looks. Three things key off the client address:
  #   - rate limiting buckets per IP — behind a proxy, every visitor would share one bucket
  #   - login_events records the source of each sign-in attempt
  #   - audit_events records who made each administrative change
  # All three would otherwise record the load balancer.
  #
  # Defaults to NATIVE: Tomcat's RemoteIpValve, which only honours X-Forwarded-* from private-network
  # addresses (10/8, 172.16/12, 192.168/16, loopback). Use FRAMEWORK when a proxy you control sets
  # those headers, or NONE when the server is exposed directly and nothing strips them.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:NATIVE}

  compression:
    # The console's largest bundle is ~1.1MB uncompressed. Compression is off by default in Spring
    # Boot, so every visitor was downloading all of it.
    enabled: true
    mime-types: text/html,text/css,text/plain,application/javascript,text/javascript,application/json,image/svg+xml
    # Below this, the CPU and the extra header cost more than the bytes saved.
    min-response-size: 1024
  servlet:
    session:
      cookie:
        http-only: true
        # Secure automatically when ISSUER_URL is https:// (SecureCookieEnvironmentPostProcessor),
        # off for plain-http local runs. Set SERVER_SERVLET_SESSION_COOKIE_SECURE to override.
        secure: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:${portal.session.secure-cookie-default:false}}
        same-site: lax

app:
  bootstrap:
    # The first administrator on a fresh deployment. Both unset by default, and nothing happens
    # unless BOTH are set — so this product never ships with a default administrator or a known
    # password. Supply them as environment variables (APP_BOOTSTRAP_ADMIN_EMAIL /
    # APP_BOOTSTRAP_ADMIN_PASSWORD) or in config/application-local.yml, which is gitignored.
    #
    # Acts only when no *enabled* administrator exists, so leaving these set is harmless on
    # restart — and doubles as the recovery path if every admin account ends up disabled. If the
    # address already has an account it is granted ROLE_ADMIN and enabled, but its password is
    # never overwritten. Minimum password length is 12.
    #
    # Remove them once you have signed in: while they are set, anyone who can read your
    # configuration knows this account's password.
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    # With neither of the above set: print a one-time setup key and write it to
    # <portal home>/secrets/initialAdminPassword, for the setup wizard on the sign-in page.
    auto-generate: ${APP_BOOTSTRAP_AUTO_GENERATE:true}

  seed:
    # Dev/test convenience only: seeds a test user, an admin user, and a hardcoded PKCE-only
    # OAuth client. Must stay off in real deployments; portal-client is the real
    # client-registration path.
    test-data: false

  security:
    # Consecutive failed sign-ins before an account is locked. The counter resets on any
    # successful sign-in. Unlock via POST /api/admin/users/{id}/unlock.
    max-failed-login-attempts: 5

    mfa:
      # Protects stored TOTP secrets (AES-256-GCM). REQUIRED before anyone can enrol in MFA —
      # there is deliberately no default. An earlier version fell back to a key written into the
      # application source, which for a self-hosted product means a published key: a database dump
      # was a complete second-factor bypass, silently.
      #
      # Unset, MFA is unavailable and enrolment is refused. Unset *with* secrets already stored,
      # the server refuses to start — that combination is the unsafe legacy state, and the fix is
      # to set a key and restart, which re-encrypts the existing secrets automatically.
      #
      # Losing this key means every enrolled user must re-enrol, so back it up with your database
      # credentials. Supply it as APP_SECURITY_MFA_ENCRYPTION_KEY.
      encryption-key: ${APP_SECURITY_MFA_ENCRYPTION_KEY:}
      auto-generate-key: ${APP_SECURITY_MFA_AUTO_GENERATE_KEY:true}
      # Set only while rotating: secrets still readable under it are re-encrypted with the active
      # key at startup, after which this can be removed.
      previous-encryption-key: ${APP_SECURITY_MFA_PREVIOUS_ENCRYPTION_KEY:}

    password:
      # Applied wherever a password is set: admin-created accounts, self-registration, and the
      # startup bootstrap (which additionally requires 12+). Published to the sign-up page via
      # GET /api/public/registration-policy so the rules are stated before anyone types.
      #
      # Composition rules are a weak control on their own — they mostly produce Password1! — and
      # NIST 800-63B now advises length plus a breach-list check instead. There is no breach list
      # here yet, so these defaults keep a modest floor. Raising min-length is worth more than
      # turning on require-symbol.
      min-length: 10
      max-length: 100
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-symbol: false
      # Password expiry. A password older than this must be changed at the next password sign-in,
      # and My Account counts down to it. 0 turns expiry off. NIST 800-63B advises against forced
      # rotation (it breeds Summer2024! -> Autumn2024!); it is here because many compliance regimes
      # still require it. Existing accounts start their clock when this version is first deployed.
      max-age-days: ${APP_SECURITY_PASSWORD_MAX_AGE_DAYS:90}
      # How many days before expiry the console starts warning.
      expiry-warning-days: ${APP_SECURITY_PASSWORD_EXPIRY_WARNING_DAYS:14}

  mail:
    # Outbound email. Host, port, credentials, TLS mode and the From address are NOT here: an
    # administrator sets them in Settings -> Email (SMTP) and they are stored in the smtp_settings
    # table, so changing a relay needs neither a restart nor filesystem access on the host. The
    # relay password is encrypted at rest with app.security.mfa.encryption-key, this deployment's
    # single at-rest key.
    #
    # Only the timeouts live here, because the right value depends on the network rather than on
    # who is administering the console. They are short on purpose: a test send that hangs for a
    # minute is indistinguishable from a broken console, and a wedged relay must not be able to
    # pin request threads.
    connection-timeout: 10s
    read-timeout: 10s
    write-timeout: 10s

  magic-link:
    # Abuse controls for passwordless sign-in. Whether magic links are ON, and how long one lives,
    # are set by an administrator in Settings -> Email templates; these stay properties so turning
    # the feature on in the console cannot also loosen them.
    #
    # The per-address cap does a job the per-IP rate limiter cannot: an attacker rotating source
    # addresses to flood one person's mailbox never trips a per-IP bucket, because every request
    # comes from somewhere new.
    max-per-address-per-window: 5
    window: 15m
    # How long consumed and expired tokens are kept before the purge job deletes them. Not zero:
    # the tail is what lets an administrator answer "was a link issued for this address?" after an
    # incident report.
    retention: 7d
    purge-cron: "0 20 * * * *"

  password-reset:
    # "Forgot password?" links. Offered only while an SMTP relay is configured.
    ttl: 30m
    # Per-address cap, alongside the per-IP rate limit below; see app.magic-link for why both.
    max-per-address-per-window: 3
    window: 15m
    retention: 7d
    purge-cron: "0 25 * * * *"

  analytics:
    retention:
      # login_events gains a row on every sign-in attempt. Deletes entries older than 48 hours.
      # Deleting happens in batches so a first run against a large backlog does not hold one long lock.
      login-events-hours: 48
      batch-size: 1000
      cron: "0 0 * * * *"

  rate-limit:
    # Per-IP request limits. Complements the per-account lockout, which caps guesses against a
    # single account but not overall volume — spreading attempts across many usernames, or
    # hammering the public registration endpoint, never trips it.
    # capacity = burst allowed back-to-back; per-minute = sustained refill rate.
    enabled: true
    max-keys: 50000
    rules:
      "[/login]": { capacity: 10, per-minute: 20 }
      "[/api/public/register]": { capacity: 5, per-minute: 5 }
      "[/api/public/]": { capacity: 30, per-minute: 60 }
      "[/oauth2/token]": { capacity: 30, per-minute: 120 }
      # Unauthenticated app-connect submissions and redeems; a real app needs a handful.
      "[/api/external/connect/]": { capacity: 10, per-minute: 10 }
      # Magic-link requests send mail to an address the caller chose, which makes an unlimited
      # endpoint a mail-flood tool aimed at third parties and a way to burn a relay's reputation.
      # Tight on purpose: a real user asks for one link, occasionally two.
      "[/api/public/magic-link/request]": { capacity: 3, per-minute: 5 }
      # Self-service endpoints that check a password or a TOTP code. The caller already holds a
      # session, but a stolen one must not become a free oracle for guessing the password behind it.
      "[/api/user/account/password]": { capacity: 5, per-minute: 5 }
      "[/api/user/account/recovery-codes]": { capacity: 5, per-minute: 5 }
      "[/api/mfa/disable]": { capacity: 5, per-minute: 5 }
      # Forgot-password emails go to an address the caller chose, like magic links.
      "[/api/public/password-reset/request]": { capacity: 3, per-minute: 5 }
      "[/api/public/password-reset/confirm]": { capacity: 10, per-minute: 10 }
      "[/password-expired]": { capacity: 10, per-minute: 10 }
      # The unauthenticated first-run wizard. The setup key is unguessable; this just keeps the
      # endpoint from being a free oracle while a fresh install waits for its operator.
      "[/api/public/setup/initialize]": { capacity: 5, per-minute: 5 }

  connect:
    # "Connect with Portal SSO": apps register themselves, an administrator approves at
    # /connect/{id}, and the app backend collects its credentials directly. Nobody copies a secret.
    enabled: ${APP_CONNECT_ENABLED:true}
    pending-ttl: 24h
    redeem-ttl: 1h
    code-ttl: 10m
    max-pending: 50
    max-redeem-attempts: 5
    # Accept http:// app URLs beyond localhost. Leave off: the delivery code travels in the URL.
    allow-insecure-http: ${APP_CONNECT_ALLOW_INSECURE_HTTP:false}

  registration:
    # Public self-registration, off by default. A Portal SSO account is global — it grants access
    # to every application behind this server — so opening it is an explicit decision, not a
    # default. Relying apps link users to this server's /sign-up page; they never create accounts
    # themselves.
    enabled: false
    # New accounts are created disabled until an administrator enables them. Worth turning on
    # while email verification does not exist, since nothing yet proves a registrant owns the
    # address they typed.
    require-admin-approval: false
    default-role: ROLE_USER
