<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Authorize ' + ${clientName}">Authorize</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <th:block th:replace="~{_styles :: styles}"></th:block>
</head>
<body>
  <div class="widget-container">
    <div class="widget-card">
      <div class="widget-header">
        <div th:if="${clientLogoUrl != null}" class="lockup">
          <img src="/logo.svg" alt="Portal SSO">
          <span class="divider"></span>
          <img th:src="${clientLogoUrl}" th:alt="${clientName}">
        </div>
        <div th:if="${clientLogoUrl == null}" class="logo-fallback">
          <img src="/logo.svg" alt="Portal SSO">
          <span th:text="${clientName != null ? clientName : 'Portal SSO'}">Portal SSO</span>
        </div>
      </div>

      <div class="widget-body">
        <h1 class="widget-title" th:text="${clientName} + ' wants access'">App Requesting Access</h1>
        <p style="text-align:center;font-size:13px;color:#64748b;margin-bottom:18px">
          Signed in as <strong style="color:#1e293b" th:text="${principalName}">you</strong>
        </p>

        <form method="post" th:action="@{/oauth2/authorize}">
          <p style="margin:0 0 12px;font-size:12.5px;color:#64748b">
            This will allow <strong style="color:#334155" th:text="${clientName}">the app</strong> to:
          </p>

          <ul class="scopes-list">
            <li th:each="s : ${scopes}" class="scope-item">
              <input type="checkbox" name="scope" th:value="${s.scope}" checked id="scope_${s.scope}">
              <label th:for="'scope_' + ${s.scope}" style="margin-bottom:0;cursor:pointer;">
                <span style="font-size:13px;font-weight:600;color:#1e293b" th:text="${s.description}">Scope</span>
                <span style="display:block;font-size:11.5px;color:#94a3b8" th:text="${s.scope}">scope</span>
              </label>
            </li>
          </ul>

          <input type="hidden" name="client_id" th:value="${clientId}">
          <input type="hidden" name="state" th:value="${state}">
          <input type="hidden" th:if="${userCode != null}" name="user_code" th:value="${userCode}">

          <button type="submit" class="btn-sign-in">Allow Access</button>
        </form>

        <form method="post" th:action="@{/oauth2/authorize}" style="margin-top:10px">
          <input type="hidden" name="client_id" th:value="${clientId}">
          <input type="hidden" name="state" th:value="${state}">
          <input type="hidden" th:if="${userCode != null}" name="user_code" th:value="${userCode}">
          <button type="submit" class="btn-secondary">Cancel</button>
        </form>
      </div>
    </div>

    <p class="badge-powered">Powered by <strong>Portal SSO</strong></p>
  </div>
</body>
</html>
