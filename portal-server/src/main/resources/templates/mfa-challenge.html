<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${clientName} != null ? 'Two-Factor Authentication · ' + ${clientName} : 'Two-Factor Authentication · Portal SSO'">Two-Factor Authentication</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <th:block th:replace="~{_styles :: styles}"></th:block>
</head>
<body>
  <div class="widget-container">
    <div class="widget-card">
      <div class="widget-header">
        <div th:if="${clientLogoUrl != null}" class="lockup">
          <img src="/logo.svg" alt="Portal SSO">
          <span class="divider"></span>
          <img th:src="${clientLogoUrl}" th:alt="${clientName}">
        </div>
        <div th:if="${clientLogoUrl == null}" class="logo-fallback">
          <img src="/logo.svg" alt="Portal SSO">
          <span>Portal SSO</span>
        </div>
      </div>

      <div class="widget-body">
        <h1 class="widget-title">Extra Verification</h1>
        <p style="text-align:center;font-size:13px;color:#64748b;margin-bottom:20px"
           th:text="${email != null ? 'Enter the 6-digit code for ' + email : 'Enter the code from your authenticator app'}">
          Enter the verification code from your authenticator app
        </p>

        <form method="post" th:action="@{/mfa-challenge}">
          <div th:if="${error}" class="alert-banner alert-error" role="alert">
            <svg style="flex-shrink:0;width:16px;height:16px;margin-top:1px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
            </svg>
            <span>Invalid code. Check your authenticator app or recovery code and try again.</span>
          </div>

          <div class="form-group" style="margin-bottom:22px">
            <label for="code">Security Code or Recovery Code</label>
            <input
              id="code"
              name="code"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              required
              autofocus
              placeholder="123456"
              style="letter-spacing:0.18em;font-family:ui-monospace,monospace;font-size:1.2rem;text-align:center;font-weight:600;"
            />
          </div>

          <button type="submit" class="btn-sign-in">Verify & Continue</button>
        </form>

        <div class="footer-links" style="margin-top:20px;text-align:center;align-items:center;">
          <a href="/login">Cancel and return to sign in</a>
        </div>
      </div>
    </div>

    <p class="badge-powered">Powered by <strong>Portal SSO</strong></p>
  </div>
</body>
</html>
