<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${clientName} != null ? 'Password expired · ' + ${clientName} : 'Password expired · Portal SSO'">Password expired</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <th:block th:replace="~{_styles :: styles}"></th:block>
</head>
<body>
  <div class="widget-container">
    <div class="widget-card">
      <div class="widget-header">
        <div th:if="${clientLogoUrl != null}" class="lockup">
          <img src="/logo.svg" alt="Portal SSO">
          <span class="divider"></span>
          <img th:src="${clientLogoUrl}" th:alt="${clientName}">
        </div>
        <div th:if="${clientLogoUrl == null}" class="logo-fallback">
          <img src="/logo.svg" alt="Portal SSO">
          <span>Portal SSO</span>
        </div>
      </div>

      <div class="widget-body">
        <h1 class="widget-title">Your password has expired</h1>
        <p style="text-align:center;font-size:13px;color:#64748b;margin-bottom:20px">
          Passwords on this server last <strong th:text="${maxAgeDays} + ' days'">90 days</strong>.
          Choose a new one for <strong th:text="${email}">you@example.com</strong> to continue.
        </p>

        <form method="post" th:action="@{/password-expired}">
          <div th:if="${errorMessage != null}" class="alert-banner alert-error" role="alert">
            <svg style="flex-shrink:0;width:16px;height:16px;margin-top:1px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
            </svg>
            <span th:text="${errorMessage}">The password does not meet the policy.</span>
          </div>

          <!-- Lets password managers file the new password under the right account. -->
          <input type="email" name="username" autocomplete="username" th:value="${email}" hidden>

          <div class="form-group">
            <label for="newPassword">New password</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password"
                   required autofocus th:attr="maxlength=${maxLength}" aria-describedby="password-rules">
          </div>
          <div class="form-group" style="margin-bottom:14px">
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
          </div>

          <ul id="password-rules" style="margin:0 0 20px;padding-left:18px;font-size:12px;line-height:20px;color:#64748b">
            <li th:each="rule : ${rules}" th:text="${rule}">At least 10 characters</li>
            <li>Different from your current password</li>
          </ul>

          <button type="submit" class="btn-sign-in">Change password &amp; continue</button>
        </form>

        <div class="footer-links" style="margin-top:20px;text-align:center;align-items:center;">
          <a href="/login">Cancel and return to sign in</a>
        </div>
      </div>
    </div>

    <p class="badge-powered">Powered by <strong>Portal SSO</strong></p>
  </div>
</body>
</html>
