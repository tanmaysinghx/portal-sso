<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="styles">
  <style>
    :root {
      --bg: #09090b; --surface: rgba(24,24,27,.72); --line: #27272a; --line-soft: #3f3f46;
      --text: #fafafa; --text-2: #a1a1aa; --text-3: #71717a;
      --brand: #f59e0b; --brand-600: #ea580c; --brand-700: #c2410c;
      --danger: #f87171; --ok: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
      position: relative; overflow-x: hidden;
    }
    /* Warm glow taken from the logo gradient, so this page reads as the same product. */
    .glow {
      position: fixed; top: -8rem; left: 50%; transform: translateX(-50%);
      width: 46rem; height: 28rem; border-radius: 9999px; pointer-events: none;
      background: linear-gradient(135deg, #f59e0b, #ef4444); opacity: .16; filter: blur(110px);
    }
    .shell { position: relative; width: 100%; max-width: 25rem; }
    .brandmark { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 1.75rem; }
    .brandmark img.logo { height: 4.5rem; width: 4.5rem; border-radius: 19px; box-shadow: 0 18px 40px rgba(0,0,0,.55); }
    .lockup { display: inline-flex; align-items: center; gap: .75rem; padding: .6rem .9rem;
      border: 1px solid var(--line); border-radius: 1rem; background: rgba(24,24,27,.8); }
    .lockup img { height: 2.25rem; width: 2.25rem; border-radius: .6rem; object-fit: contain; }
    .lockup .divider { width: 1px; height: 1.5rem; background: var(--line-soft); }
    h1 { margin: 1rem 0 0; font-size: 1.35rem; font-weight: 600; letter-spacing: -.02em; }
    .sub { margin: .4rem 0 0; font-size: .875rem; color: var(--text-2); }
    .card {
      border: 1px solid var(--line); border-radius: 1rem; background: var(--surface);
      padding: 1.75rem; box-shadow: 0 24px 60px rgba(0,0,0,.5); backdrop-filter: blur(12px);
    }
    label { display: block; margin-bottom: .4rem; font-size: .75rem; font-weight: 500; color: var(--text-2); }
    input[type=email], input[type=password], input[type=text] {
      display: block; width: 100%; padding: .65rem .85rem; font-size: .875rem;
      color: #fff; background: rgba(9,9,11,.6); border: 1px solid var(--line-soft);
      border-radius: .5rem; transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder { color: #52525b; }
    input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(245,158,11,.22); }
    .field { margin-bottom: 1rem; }
    button.primary {
      width: 100%; padding: .7rem 1rem; font-size: .875rem; font-weight: 600; color: #fff;
      background: var(--brand-600); border: 0; border-radius: .5rem; cursor: pointer;
      box-shadow: 0 10px 24px rgba(234,88,12,.25); transition: background .15s;
    }
    button.primary:hover { background: var(--brand-700); }
    button.secondary {
      width: 100%; padding: .7rem 1rem; font-size: .875rem; font-weight: 600; color: var(--text-2);
      background: transparent; border: 1px solid var(--line-soft); border-radius: .5rem; cursor: pointer;
    }
    button.secondary:hover { color: #fff; border-color: #52525b; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .alert {
      display: flex; gap: .6rem; padding: .7rem .85rem; margin-bottom: 1.25rem;
      border-radius: .5rem; font-size: .8125rem; line-height: 1.45;
    }
    .alert.error { color: #fca5a5; background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.22); }
    .alert.ok { color: #6ee7b7; background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.22); }
    .scopes { list-style: none; margin: 0 0 1.5rem; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
    .scope {
      display: flex; align-items: flex-start; gap: .7rem; padding: .75rem .85rem;
      border: 1px solid var(--line); border-radius: .6rem; background: rgba(9,9,11,.45); cursor: pointer;
    }
    .scope input { margin: .15rem 0 0; accent-color: var(--brand-600); width: 1rem; height: 1rem; }
    .scope .name { font-size: .875rem; color: #fff; }
    .scope .desc { display: block; font-size: .75rem; color: var(--text-3); margin-top: .1rem; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .foot { margin-top: 1.5rem; text-align: center; font-size: .75rem; color: var(--text-3); }
    .foot a { color: var(--brand); text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</th:block>
