<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="styles">
  <style>
    :root {
      --bg: #eceef1;
      --card-bg: #ffffff;
      --card-border: #d2d6dc;
      --header-bg: #ffffff;
      --header-border: #e5e7eb;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --text-label: #4b5563;
      --input-border: #cbd5e1;
      --input-bg: #ffffff;
      --input-focus: #1662dd;
      --btn-primary: #1662dd;
      --btn-primary-hover: #1251b8;
      --link-color: #6b7280;
      --link-hover: #1662dd;
      --alert-error-bg: #fef2f2;
      --alert-error-border: #fecaca;
      --alert-error-text: #b91c1c;
      --alert-ok-bg: #f0fdf4;
      --alert-ok-border: #bbf7d0;
      --alert-ok-text: #15803d;
      --radius: 4px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .widget-container {
      width: 100%;
      max-width: 390px;
    }

    .widget-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.07);
      overflow: hidden;
    }

    /* Okta-style top logo header with separator */
    .widget-header {
      padding: 28px 32px 20px;
      text-align: center;
      border-bottom: 1px solid var(--header-border);
      background: var(--header-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .widget-header .logo {
      height: 42px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
    }

    .widget-header .logo-fallback {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .widget-header .logo-fallback img {
      height: 36px;
      width: 36px;
      border-radius: 8px;
    }

    .widget-header .logo-fallback span {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1e293b;
    }

    .widget-header .lockup {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .widget-header .lockup img {
      height: 32px;
      max-width: 120px;
      object-fit: contain;
    }

    .widget-header .lockup .divider {
      width: 1px;
      height: 20px;
      background: #cbd5e1;
    }

    .widget-header .app-name-tag {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    /* Form body */
    .widget-body {
      padding: 28px 36px 36px;
    }

    .widget-title {
      text-align: center;
      font-size: 19px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 24px;
      letter-spacing: -0.01em;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-label);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      height: 42px;
      padding: 8px 12px;
      font-size: 14px;
      color: var(--text-main);
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      outline: none;
    }

    input[type="password"] {
      padding-right: 38px;
    }

    .input-with-toggle input[type="text"] {
      padding-right: 38px;
    }

    input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px rgba(22, 98, 221, 0.2);
    }

    .pw-toggle-btn {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
    }

    .pw-toggle-btn:hover {
      color: #475569;
    }

    .remember-me-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 18px 0 22px;
      cursor: pointer;
      user-select: none;
    }

    .remember-me-row input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--btn-primary);
      cursor: pointer;
      border-radius: 3px;
    }

    .remember-me-row span {
      font-size: 13px;
      color: #4b5563;
    }

    .btn-sign-in {
      width: 100%;
      height: 42px;
      background-color: var(--btn-primary);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-sign-in:hover {
      background-color: var(--btn-primary-hover);
    }

    .btn-sign-in:focus-visible {
      outline: 2px solid var(--btn-primary);
      outline-offset: 2px;
    }

    .footer-links {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      text-align: left;
    }

    .footer-links a {
      font-size: 13px;
      color: var(--link-color);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .footer-links a:hover {
      color: var(--link-hover);
      text-decoration: underline;
    }

    .alert-banner {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      margin-bottom: 20px;
      border-radius: var(--radius);
      font-size: 12.5px;
      line-height: 1.45;
    }

    .alert-error {
      background-color: var(--alert-error-bg);
      border: 1px solid var(--alert-error-border);
      color: var(--alert-error-text);
    }

    .alert-ok {
      background-color: var(--alert-ok-bg);
      border: 1px solid var(--alert-ok-border);
      color: var(--alert-ok-text);
    }

    .badge-powered {
      margin-top: 24px;
      text-align: center;
      font-size: 11.5px;
      color: #94a3b8;
    }

    .badge-powered strong {
      color: #64748b;
      font-weight: 600;
    }

    /* Consent scopes */
    .scopes-list {
      list-style: none;
      margin: 0 0 20px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .scope-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--header-border);
      border-radius: var(--radius);
      background: #fafafa;
    }

    .scope-item input[type="checkbox"] {
      margin-top: 3px;
      accent-color: var(--btn-primary);
    }

    .btn-secondary {
      width: 100%;
      height: 40px;
      background: transparent;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      color: var(--text-label);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-secondary:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
  </style>
</th:block>
