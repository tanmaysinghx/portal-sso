      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="#18181B"/>

  <!-- Outer Isometric Hexagon -->
