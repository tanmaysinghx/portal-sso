<!-- Top Header Bar -->
<header class="sticky top-0 z-20 flex h-16 shrink-0 items-center justify-between border-b border-ink-200/80 bg-white/90 px-8 backdrop-blur-md">
  <!-- Inline Search Container (Balanced Width) -->
  <div class="relative w-full max-w-sm sm:max-w-md">
    <div class="relative flex items-center">
      <svg class="pointer-events-none absolute left-3 h-4 w-4 text-ink-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
      </svg>

      <input
        #searchInput
        type="text"
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event)"
        (focus)="onFocus()"
        placeholder="Search clients, users, settings..."
        class="block w-full rounded-xl border border-ink-200 bg-ink-50/70 pl-9 pr-14 py-1.5 text-xs text-ink-900 shadow-xs transition placeholder:text-ink-400 focus:border-brand-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20"
      />

      <div class="absolute right-2.5 flex items-center gap-1.5">
        @if (searchQuery()) {
          <button
            type="button"
            (click)="clearSearch()"
            class="rounded-md p-1 text-ink-400 hover:bg-ink-200 hover:text-ink-700 transition"
            title="Clear search"
          >
            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        }
        <kbd class="hidden sm:inline-flex items-center rounded border border-ink-200 bg-white px-1.5 py-0.5 font-mono text-[10px] font-semibold text-ink-400 shadow-xs">
          ⌘K
        </kbd>
      </div>
    </div>

    <!-- Attached Floating Results Dropdown (Opens inline beneath input) -->
    @if (isDropdownOpen()) {
      <div class="absolute left-0 right-0 top-full mt-1.5 z-30 overflow-hidden rounded-xl border border-ink-200 bg-white shadow-xl transition-all">
        <div class="max-h-80 overflow-y-auto p-1.5 divide-y divide-ink-50">
          @if (filteredSearchItems().length === 0) {
            <div class="p-6 text-center">
              <p class="text-xs font-medium text-ink-700">No results found for "{{ searchQuery() }}"</p>
              <p class="mt-0.5 text-[11px] text-ink-400">Try searching for "dashboard", "clients", "users", or "settings".</p>
            </div>
          } @else {
            @for (item of filteredSearchItems(); track item.id) {
              <button
                type="button"
                (mousedown)="selectSearchItem(item)"
                class="flex w-full items-center justify-between gap-3 rounded-lg px-3 py-2 text-left transition hover:bg-ink-50 focus:bg-ink-50 focus:outline-none group"
              >
                <div class="flex items-center gap-2.5 min-w-0">
                  <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-ink-100 text-ink-700 group-hover:bg-brand-50 group-hover:text-brand-600 transition">
                    @if (item.category === 'Action') {
                      <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                      </svg>
                    } @else {
                      <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
                      </svg>
                    }
                  </div>
                  <div class="min-w-0">
                    <div class="flex items-center gap-1.5">
                      <span class="truncate text-xs font-semibold text-ink-900">{{ item.title }}</span>
                      <span class="rounded bg-ink-100 px-1.5 py-0.2 text-[9px] font-medium text-ink-500">{{ item.category }}</span>
                    </div>
                    <p class="truncate text-[11px] text-ink-500">{{ item.description }}</p>
                  </div>
                </div>

                <svg class="h-3.5 w-3.5 shrink-0 text-ink-300 group-hover:text-brand-500 transition" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                </svg>
              </button>
            }
          }
        </div>
      </div>
    }
  </div>

  <!-- Right Header Status & Navigation -->
  <div class="flex items-center gap-3">
    <!-- Live Status Pill -->
    <div class="hidden sm:flex items-center gap-2 rounded-full border border-emerald-500/20 bg-emerald-50 px-3 py-1 text-xs font-medium text-emerald-700">
      <span class="relative flex h-2 w-2">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
      </span>
      <span>OAuth 2.1 Live</span>
    </div>

    <a
      routerLink="/settings"
      class="rounded-lg p-2 text-ink-500 hover:bg-ink-100 hover:text-ink-900 transition"
      title="Open Settings"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </a>

    <a
      routerLink="/docs"
      target="_blank"
      class="hidden sm:inline-flex items-center gap-1.5 rounded-lg border border-ink-200 bg-white px-3 py-1.5 text-xs font-medium text-ink-700 shadow-sm hover:bg-ink-50 transition"
    >
      <span>Docs</span>
      <svg class="h-3 w-3 text-ink-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
      </svg>
    </a>
  </div>
</header>
