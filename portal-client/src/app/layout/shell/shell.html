<div class="flex min-h-screen bg-ink-50">
  <app-sidebar [open]="sidebarOpen()" (dismiss)="closeSidebar()" />

  <!-- The sidebar is fixed, so the content is offset by its width — but only once it is actually
       on screen. Below lg it is an off-canvas drawer and the content uses the full width. -->
  <!-- min-w-0 is load-bearing: a flex child defaults to min-width:auto, so without it this column
       refuses to shrink below the width of its widest content and a wide table pushes the whole
       page sideways instead of scrolling inside its own container. -->
  <div class="flex min-h-screen min-w-0 flex-1 flex-col lg:ml-64">
    <app-header (menuToggle)="toggleSidebar()" />

    <main class="flex-1 px-4 py-6 sm:px-6 sm:py-8 lg:px-10 lg:py-9">
      <div class="mx-auto w-full max-w-5xl">
        @if (authService.isAdmin() && isEmbeddedDb() && showDbBanner()) {
          <div class="mb-6 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-amber-200 bg-amber-50/90 px-4 py-3 shadow-xs">
            <div class="flex items-center gap-3">
              <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-amber-100 text-amber-600">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                </svg>
              </div>
              <div>
                <span class="font-semibold text-xs text-amber-900">Embedded Database (H2):</span>
                <span class="ml-1 text-xs text-amber-700">Portal SSO is running in local evaluation mode. For production reliability, high concurrency, and clustering, migrate to PostgreSQL or MySQL.</span>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <a
                routerLink="/settings"
                [queryParams]="{ tab: 'database' }"
                class="inline-flex items-center gap-1.5 rounded-lg bg-amber-600 px-3 py-1.5 text-xs font-semibold text-white shadow-xs hover:bg-amber-700 transition-colors"
              >
                <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 5.625c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125" />
                </svg>
                <span>Migrate to PostgreSQL / MySQL</span>
              </a>
              <button
                type="button"
                (click)="dismissDbBanner()"
                class="rounded-lg p-1 text-amber-600 hover:bg-amber-100 transition-colors"
                title="Dismiss"
              >
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
          </div>
        }
        <router-outlet />
      </div>
    </main>
  </div>
</div>
