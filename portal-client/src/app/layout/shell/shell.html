<div class="flex min-h-screen bg-ink-50">
  <!-- Sidebar: zinc-950 to echo the logo's own #18181B tile, so the mark sits in its native
       context rather than on a foreign light panel. -->
  <aside class="fixed inset-y-0 left-0 z-20 flex w-64 flex-col bg-ink-950">
    <div class="flex h-16 items-center gap-2.5 px-5">
      <img src="logo-mark.svg" alt="" class="h-10 w-10 -ml-1" />
      <div class="flex flex-col leading-none">
        <span class="text-[15px] font-semibold tracking-tight text-white">Portal SSO</span>
        <span class="mt-0.5 text-[10px] font-medium uppercase tracking-widest text-ink-500">Identity</span>
      </div>
    </div>

    <nav class="mt-4 flex-1 space-y-0.5 px-3">
      <p class="px-3 pb-2 text-[10px] font-semibold uppercase tracking-widest text-ink-600">Manage</p>

      <!-- The active state is driven off the routerLinkActive instance rather than its class list:
           the indicator bar is a child with no routerLink of its own, and binding explicitly also
           avoids two same-specificity utilities (text-ink-400 vs text-white) fighting over
           stylesheet order. -->
      <a
        routerLink="/dashboard"
        routerLinkActive
        #dash="routerLinkActive"
        class="relative flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium transition-colors"
        [class]="dash.isActive ? 'bg-ink-800/70 text-white' : 'text-ink-400 hover:bg-ink-900 hover:text-ink-100'"
      >
        <span class="absolute -left-2 h-5 w-0.5 rounded-r bg-brand-500 transition-opacity" [class.opacity-0]="!dash.isActive"></span>
        <svg class="h-[18px] w-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
        </svg>
        Dashboard
      </a>

      <a
        routerLink="/clients"
        routerLinkActive
        #clients="routerLinkActive"
        class="relative flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium transition-colors"
        [class]="clients.isActive ? 'bg-ink-800/70 text-white' : 'text-ink-400 hover:bg-ink-900 hover:text-ink-100'"
      >
        <span class="absolute -left-2 h-5 w-0.5 rounded-r bg-brand-500 transition-opacity" [class.opacity-0]="!clients.isActive"></span>
        <svg class="h-[18px] w-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
        </svg>
        OAuth Clients
      </a>

      <a
        routerLink="/users"
        routerLinkActive
        #users="routerLinkActive"
        class="relative flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium transition-colors"
        [class]="users.isActive ? 'bg-ink-800/70 text-white' : 'text-ink-400 hover:bg-ink-900 hover:text-ink-100'"
      >
        <span class="absolute -left-2 h-5 w-0.5 rounded-r bg-brand-500 transition-opacity" [class.opacity-0]="!users.isActive"></span>
        <svg class="h-[18px] w-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
        </svg>
        Users
      </a>

      <p class="px-3 pt-4 pb-2 text-[10px] font-semibold uppercase tracking-widest text-ink-600">Product</p>

      <a
        routerLink="/product"
        target="_blank"
        class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-ink-400 transition-colors hover:bg-ink-900 hover:text-ink-100"
      >
        <svg class="h-[18px] w-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.28m5.94 2.28l-2.28 5.941" />
        </svg>
        Product Showcase
      </a>
    </nav>

    <div class="p-3">
      <div class="rounded-xl bg-ink-900 p-3">
        <div class="flex items-center gap-2.5">
          <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-brand-500 to-red-500 text-xs font-semibold text-white">
            {{ initial() }}
          </div>
          <div class="min-w-0 flex-1">
            <p class="truncate text-xs font-medium text-ink-100">{{ currentUser()?.email }}</p>
            <p class="text-[10px] text-ink-500">Administrator</p>
          </div>
        </div>
        <button
          type="button"
          (click)="logout()"
          class="mt-2.5 flex w-full items-center justify-center gap-1.5 rounded-lg border border-ink-800 px-3 py-1.5 text-xs font-medium text-ink-400 transition-colors hover:border-ink-700 hover:text-white"
        >
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l3 3m0 0l-3 3m3-3H2.25" />
          </svg>
          Sign out
        </button>
      </div>
    </div>
  </aside>

  <main class="ml-64 flex-1 px-10 py-9">
    <div class="mx-auto max-w-5xl">
      <router-outlet />
    </div>
  </main>
</div>
